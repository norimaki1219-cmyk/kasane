<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300" role="img" aria-label="導入前後の作業時間の比較。見積作成は45分から28分、請求書処理は30分から12分、必要なナレッジを探す時間は25分から8分に短縮された例">
  <style>
    text{ font-family:'Zen Kaku Gothic New','Yu Gothic','Meiryo',sans-serif; fill:#40464E; font-size:13px; }
    .lab{ fill:#22262B; font-weight:500; font-size:14px; }
    .v{ font-weight:700; }
    .grid{ stroke:#E4E2DC; stroke-width:1; }
  </style>
  <rect width="600" height="300" fill="#FFFFFF"/>

  <!-- 凡例 -->
  <g>
    <rect x="170" y="12" width="14" height="14" rx="2" fill="#A9B0BA"/><text x="190" y="24" style="fill:#22262B">導入前</text>
    <rect x="260" y="12" width="14" height="14" rx="2" fill="#3F7A5B"/><text x="280" y="24" style="fill:#22262B">導入後</text>
  </g>

  <!-- 目盛り（分） -->
  <g>
    <line class="grid" x1="170" y1="44" x2="170" y2="262"/>
    <line class="grid" x1="290" y1="44" x2="290" y2="262"/>
    <line class="grid" x1="410" y1="44" x2="410" y2="262"/>
    <line class="grid" x1="530" y1="44" x2="530" y2="262"/>
    <text x="170" y="282" text-anchor="middle">0</text>
    <text x="290" y="282" text-anchor="middle">15</text>
    <text x="410" y="282" text-anchor="middle">30</text>
    <text x="530" y="282" text-anchor="middle">45分</text>
  </g>

  <!-- 見積作成：45 → 28 分（横幅は 1分＝8px） -->
  <text class="lab" x="160" y="76" text-anchor="end">見積作成</text>
  <rect x="170" y="52" width="360" height="22" rx="2" fill="#A9B0BA"/>
  <text class="v" x="536" y="68">45分</text>
  <rect x="170" y="78" width="224" height="22" rx="2" fill="#3F7A5B"/>
  <text class="v" x="400" y="94" style="fill:#3F7A5B">28分（−38%）</text>

  <!-- 請求書処理：30 → 12 分 -->
  <text class="lab" x="160" y="146" text-anchor="end">請求書処理</text>
  <rect x="170" y="122" width="240" height="22" rx="2" fill="#A9B0BA"/>
  <text class="v" x="416" y="138">30分</text>
  <rect x="170" y="148" width="96" height="22" rx="2" fill="#3F7A5B"/>
  <text class="v" x="272" y="164" style="fill:#3F7A5B">12分（−60%）</text>

  <!-- 必要なナレッジを探す：25 → 8 分 -->
  <text class="lab" x="160" y="216" text-anchor="end">必要な情報を探す</text>
  <rect x="170" y="192" width="200" height="22" rx="2" fill="#A9B0BA"/>
  <text class="v" x="376" y="208">25分</text>
  <rect x="170" y="218" width="64" height="22" rx="2" fill="#3F7A5B"/>
  <text class="v" x="240" y="234" style="fill:#3F7A5B">8分（−68%）</text>
</svg>
