<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 560" width="940" height="560" role="img" aria-label="業務フロー図の例。営業・受注管理・製造・経理の4部門で、見積作成から入金確認までの流れと、各作業に紐づくナレッジの件数を示している">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5F646C"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#22262B" flood-opacity="0.12"/>
    </filter>
  </defs>
  <style>
    text{ font-family:'Zen Kaku Gothic New','Yu Gothic','Meiryo',sans-serif; }
    .lane{ fill:#FAFAF8; stroke:#E4E2DC; }
    .head{ fill:#2B3A55; }
    .head-t{ fill:#fff; font-size:14px; font-weight:700; text-anchor:middle; }
    .task{ fill:#fff; stroke:#2B3A55; stroke-width:1.5; filter:url(#shadow); }
    .task-t{ fill:#22262B; font-size:14px; font-weight:500; text-anchor:middle; }
    .edge{ stroke:#5F646C; stroke-width:1.8; fill:none; marker-end:url(#arrow); }
    .badge{ fill:#C98A2E; }
    .badge-t{ fill:#fff; font-size:11px; font-weight:700; text-anchor:middle; }
  </style>

  <rect width="940" height="560" fill="#F5F4F1"/>

  <!-- 部門レーン -->
  <g>
    <rect class="lane" x="20"  y="60" width="210" height="490" rx="3"/>
    <rect class="lane" x="250" y="60" width="210" height="490" rx="3"/>
    <rect class="lane" x="480" y="60" width="210" height="490" rx="3"/>
    <rect class="lane" x="710" y="60" width="210" height="490" rx="3"/>
    <rect class="head" x="20"  y="20" width="210" height="34" rx="3"/>
    <rect class="head" x="250" y="20" width="210" height="34" rx="3"/>
    <rect class="head" x="480" y="20" width="210" height="34" rx="3"/>
    <rect class="head" x="710" y="20" width="210" height="34" rx="3"/>
    <text class="head-t" x="125" y="42">営業</text>
    <text class="head-t" x="355" y="42">受注管理</text>
    <text class="head-t" x="585" y="42">製造</text>
    <text class="head-t" x="815" y="42">経理</text>
  </g>

  <!-- 矢印（作業の流れ） -->
  <g>
    <path class="edge" d="M125 124 V156"/>
    <path class="edge" d="M215 182 H261"/>
    <path class="edge" d="M355 204 V236"/>
    <path class="edge" d="M445 262 H491"/>
    <path class="edge" d="M585 284 V316"/>
    <path class="edge" d="M585 364 V396"/>
    <path class="edge" d="M675 422 H721"/>
    <path class="edge" d="M815 444 V476"/>
  </g>

  <!-- 作業 -->
  <g>
    <rect class="task" x="35"  y="80"  width="180" height="44" rx="4"/><text class="task-t" x="125" y="107">見積作成</text>
    <rect class="task" x="35"  y="160" width="180" height="44" rx="4"/><text class="task-t" x="125" y="187">受注登録</text>
    <rect class="task" x="265" y="160" width="180" height="44" rx="4"/><text class="task-t" x="355" y="187">受注内容の確認</text>
    <rect class="task" x="265" y="240" width="180" height="44" rx="4"/><text class="task-t" x="355" y="267">生産指示</text>
    <rect class="task" x="495" y="240" width="180" height="44" rx="4"/><text class="task-t" x="585" y="267">材料手配</text>
    <rect class="task" x="495" y="320" width="180" height="44" rx="4"/><text class="task-t" x="585" y="347">加工・組立</text>
    <rect class="task" x="725" y="400" width="180" height="44" rx="4"/><text class="task-t" x="815" y="427">請求書発行</text>
    <rect class="task" x="725" y="480" width="180" height="44" rx="4"/><text class="task-t" x="815" y="507">入金確認</text>
  </g>

  <!-- 強調する作業：検査 -->
  <rect x="495" y="400" width="180" height="44" rx="4" fill="#fff" stroke="#C98A2E" stroke-width="3.5" filter="url(#shadow)"/>
  <text class="task-t" x="585" y="427" style="font-weight:700">検査</text>

  <!-- ナレッジ件数バッジ -->
  <g>
    <circle class="badge" cx="215" cy="80"  r="11"/><text class="badge-t" x="215" y="84">2</text>
    <circle class="badge" cx="445" cy="160" r="11"/><text class="badge-t" x="445" y="164">1</text>
    <circle class="badge" cx="445" cy="240" r="11"/><text class="badge-t" x="445" y="244">2</text>
    <circle class="badge" cx="675" cy="320" r="11"/><text class="badge-t" x="675" y="324">4</text>
    <circle class="badge" cx="675" cy="400" r="11"/><text class="badge-t" x="675" y="404">3</text>
    <circle class="badge" cx="905" cy="400" r="11"/><text class="badge-t" x="905" y="404">2</text>
  </g>

  <!-- 吹き出し：検査に紐づくナレッジ -->
  <path d="M495 422 H462" stroke="#C98A2E" stroke-width="2" fill="none"/>
  <g filter="url(#shadow)">
    <rect x="30" y="376" width="432" height="148" rx="6" fill="#FBF0DE" stroke="#ECD6AC"/>
  </g>
  <text x="48" y="404" font-size="14" font-weight="700" fill="#22262B" style="font-family:'Zen Kaku Gothic New','Yu Gothic','Meiryo',sans-serif">「検査」に紐づくナレッジ　3件</text>
  <g style="font-family:'Zen Kaku Gothic New','Yu Gothic','Meiryo',sans-serif" font-size="13.5" fill="#22262B">
    <circle cx="56" cy="430" r="3" fill="#C98A2E"/><text x="68" y="435">検査基準書（最終更新 8日前）</text>
    <circle cx="56" cy="458" r="3" fill="#C98A2E"/><text x="68" y="463">不良が出たときの対応記録</text>
    <circle cx="56" cy="486" r="3" fill="#C98A2E"/><text x="68" y="491">測定器の校正手順</text>
  </g>
  <text x="446" y="510" text-anchor="end" font-size="11.5" fill="#40464E" style="font-family:'Zen Kaku Gothic New','Yu Gothic','Meiryo',sans-serif">作業をクリックすると、関連ナレッジを開けます</text>
</svg>
