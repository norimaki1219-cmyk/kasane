<script>
const state = {

};
const LEAD_MAIL_ENDPOINT = 'https://script.google.com/macros/s/AKfycbw5_FQJGb6T48i0vJhhTF1FkLosXNnLBXlCOW96PxclE8AwnWXJtAO0qljvM0TYnQc/exec';

function encodeResumeToken(handlerName){
  const k = state.knowledge;
  const h = handlerName==='genComplete' ? 'g' : 'c';
  const mi = String(state.missionIndex||0);
  const vals = [k.idea?1:0, k.recorded||0, k.searchable||0, k.result||0, k.shared||0].join('');
  return `${h}${mi}${vals}`;
}
function decodeResumeToken(token){
  if(!token || !/^[cg]\d{6}$/.test(token)) return null;
  const h = token[0]==='g' ? 'genComplete' : 'complete';
  const mi = parseInt(token[1],10) || 0;
  const d = token.slice(2).split('').map(Number);
  return {h, mi, k:{idea:!!d[0], recorded:d[1], searchable:d[2], result:d[3], shared:d[4]}};
}
function resumeLink(handlerName){
  return `${location.href.split('?')[0]}?resume=${encodeResumeToken(handlerName)}`;
}
function leadGate(nextFn, handlerName){
  state.pendingNext = nextFn;
  state.pendingNextName = handlerName;
  render(`<div class="eyebrow">RESULT</div><h2>診断結果を見る前に</h2>
  <p class="muted" style="font-size:15px">結果は、ご入力いただいたメールアドレス宛にお送りするリンクからご覧いただきます。</p>

    <div class="leadform">
      <input type="text" name="company" id="leadCompany" placeholder="会社名（任意）">
      <input type="email" name="email" id="leadEmail" placeholder="メールアドレス（必須）" required>
    </div>
    <input type="hidden" name="link" id="leadLink" value="">
    <input type="hidden" name="mission" id="leadMission" value="">
    <p class="muted" style="font-size:12px">ご記入いただいた情報は、結果のご案内・関連事例のご紹介以外には使用しません。</p>
    <button class="btn" type="submit">結果のリンクを送る ▶</button>
  </form>`);
}
function prepareLeadSubmit(form){
  const email = (form.email.value||'').trim();
  if(!email){ alert('メールアドレスをご入力ください。結果はメールでお送りします。'); return false; }
  const company = (form.company.value||'').trim();
  const handlerName = state.pendingNextName || 'complete';
  const link = resumeLink(handlerName);
  document.getElementById('leadLink').value = link;
  document.getElementById('leadMission').value = state.mission ? state.mission.title : '現場の気づき';
  try{
    const key = 'fke_leads';
    const list = JSON.parse(localStorage.getItem(key) || '[]');
    list.push({email, company, mission: state.mission ? state.mission.title : '現場の気づき', ts: new Date().toISOString()});
    localStorage.setItem(key, JSON.stringify(list));
  }catch(e){}
  setTimeout(()=>{
    render(`<div class="eyebrow">RESULT</div><div class="icon">📩</div><h2>結果をメールでお送りしました</h2>
    <p class="muted" style="font-size:15px"><strong>${email}</strong> 宛に、診断結果を見るためのリンクを送信しました。<br>開いた別タブでも送信結果をご確認いただけます。メールボックス（迷惑メールフォルダもご確認ください）から、そのリンクを開いてください。</p>`);
  }, 50);
  return true;
}

function genBossChoice(c){

  render(`<div class="eyebrow">BOSS RESULT</div><div class="icon">${c==='record'?'📋':'💬'}</div><p>${text}</p><button class="btn" onclick="leadGate(genComplete,'genComplete')">NEXT ▶</button>`);

  state.step=9;
  render(`<div class="eyebrow">⚠ BOSS EVENT</div><div class="icon">⚠</div><h2>大口ロットの量産開始まで、あと3日。</h2>
  <p class="muted" style="font-size:14px">来週、大口顧客向けの量産立ち上げが控えている。<br>班長「少しでも生産効率を上げておきたいところだな」</p>
  <p>見つけた改善案を、<br>本番のラインで試してみることにした。</p>
  <p class="muted" style="font-size:15px">部品棚の配置を変える。<br>もし失敗すれば、逆に時間をロスすることになる。</p>
  <button class="btn danger" onclick="bossTrial()">⚠ 試してみる</button>`);
}
function bossTrial(){
  state.illustrationPhase="trial";
  state.step=9;
  if(state.searchFound){
    render(`<div class="eyebrow">⚠ RESULT</div><div class="icon impact">⏱</div><h2>結果は──</h2>
    <p class="impact">手待ち時間は<br><strong style="font-size:2em;color:var(--accent)">1台あたり8秒短縮された。</strong></p>
    <p class="muted" style="font-size:15px">確かな成果だ。しかし、この結果を<br>次の人も確認できるだろうか？</p>
    <p class="npc-line">🧑‍🔧 ベテランの田中さん「お、それ効果あったのか。俺も昔、似たようなことやってみたことあるよ」</p>
    <div class="actions"><button class="action" onclick="bossChoice('record')"><span class="aicon">📋</span>改善結果を記録する</button><button class="action" onclick="bossChoice('verbal')"><span class="aicon">💬</span>口頭で共有して終わる</button></div>`);
  } else {
    render(`<div class="eyebrow">⚠ RESULT</div><div class="icon shake">💥</div><h2>結果は──</h2>
    <p class="shake">手順を見誤り、<br><strong style="font-size:1.6em;color:var(--danger)">部品の配置ミスで組付け不良を1件出してしまった。</strong></p>
    <p class="muted" style="font-size:15px">過去に同じことを試した人がいたか、<br>確認できていなかったツケが回ってきた。</p>
    <p class="npc-line" style="border-color:var(--danger)">班長「勝手に手順を変えるな！何かあったらどうする！<br>……とにかく、これは記録に残しておけ。次の奴に同じ失敗をさせないためにな」</p>
    <div class="actions"><button class="action" onclick="bossChoice('record')"><span class="aicon">📋</span>原因と対策を記録する</button><button class="action" onclick="bossChoice('verbal')"><span class="aicon">💬</span>口頭で謝って終わらせる</button></div>`);
  }
}
function bossChoice(c){
  state.illustrationPhase="boss-choice";
  state.bossChoice=c;
  const failed=!state.searchFound;
  let text='';
  if(c==='record'){
    state.knowledge.result=2;state.knowledge.shared=2;
    text=failed
      ? '不良の原因と対策を、報告書にまとめて残した。<br><br>班長「よし。次に同じことをする奴が、これを見れば防げる」<br><br><span class="muted">失敗も、記録すれば会社の知識になる。</span>'
      : '改善結果を、成果として記録に残した。<br><br>班長「よし、量産のときにはこれも見せられるな」<br><br><span class="muted">数字と経緯が、誰でも確認できる形で残った。</span>';
  } else {
    state.knowledge.result=1;state.knowledge.shared=Math.max(state.knowledge.shared,1);
    text=failed
      ? '「すみませんでした」とその場で謝って終わらせた。<br><br>班長「……まあ、次は気をつけろよ」<br><br><span class="muted">原因も対策も、どこにも残らなかった。</span>'
      : 'みんなに「効果があった」と口頭で伝えた。<br><br>その場は「おー」という反応だった。<br><br><span class="muted">しかし量産初日、この話を覚えていたのは、あなただけだった。</span>';
  }
  render(`<div class="eyebrow">BOSS RESULT</div><div class="icon">${c==='record'?'📋':'💬'}</div><p>${text}</p><button class="btn" onclick="leadGate(complete,'complete')">NEXT ▶</button>`);
}
function knowledgeScore(){
  return state.knowledge.recorded+state.knowledge.searchable+state.knowledge.result+state.knowledge.shared;
}
function orgLevel(){
  const s=knowledgeScore();
  if(s<=1) return {lv:1,name:'属人化型',icon:'🧍',desc:'知識は個人の頭の中にしかない状態。'};
  if(s<=3) return {lv:2,name:'管理型',icon:'📋',desc:'記録はあるが、更新も検索もされない状態。'};
  if(s<=5) return {lv:3,name:'改善活動型',icon:'🔧',desc:'改善は動いているが、知識が分散している状態。'};
  if(s<=7) return {lv:4,name:'循環型',icon:'🔄',desc:'改善・共有・更新が回り始めている状態。'};
  return {lv:5,name:'成長型',icon:'🌱',desc:'利用と改善が継続的に組織へ蓄積されている状態。'};
}
function epilogue(){
  const s=knowledgeScore();
  if(s>=6) return '数か月後、別の工程を任された佐藤は、あなたが残した記録を頼りに迷わず作業を進められた。<br>佐藤「先輩が残してくれてたおかげで、すぐ分かりました」';
  if(s>=3) return '数か月後、別の工程を任された佐藤は、断片的な情報を頼りになんとか作業を終えた。<br>佐藤「もう少し詳しく分かれば、助かったんですけどね……」';
  return '数か月後、別の工程を任された佐藤は、結局あなたと同じように、一から手探りで進めるしかなかった。<br>佐藤「これ、また誰かが同じことで悩むんでしょうね……」';
}
function complete(){
  state.step=10;
  const lvl=orgLevel(), score=knowledgeScore();
  render(`<div class="eyebrow">MISSION COMPLETE</div><div class="icon">🏁</div><h1>現場の気づき</h1>
  <p>今回の現場体験で<br>会社に残った知識</p>
  <div class="status">${statusRow('💡 アイデアを残せる','idea')}${statusRow('🔍 過去の提案を探せる','searchable')}${statusRow('📊 改善結果を確認できる','result')}${statusRow('🌐 他の人が利用できる','shared')}</div>
  <p class="npc-line">${epilogue()}</p>
  <p class="muted" style="font-size:16px">改善案は、「思いつく」だけでは会社の知識にならない。<br>残す。探せる。結果を確認する。次の人が使える。<br>そこまでつながって初めて、現場の経験は会社の知識になる。</p>
  <div class="levelcard">
    <div class="eyebrow">🎮 RESULT</div>
    <div class="icon impact">${lvl.icon}</div>
    <h2 class="impact">Lv.${lvl.lv} ${lvl.name}</h2>
    <p class="muted" style="font-size:15px">${lvl.desc}</p>
    <div class="bar"><div style="width:${score/8*100}%"></div></div>
    <p class="muted" style="font-size:12px">組織進化レベル ${score} / 8　※MISSION 01（全5ミッション中の1つ）の結果です</p>
  </div>
  <button class="btn" onclick="solutionScreen()">NEXT ▶</button>`);
}
function statusRowCompare(label,key){
  const v=state.knowledge[key], pct=v===2?100:v===1?45:5;
  return `<div class="compare-row"><strong>${label}</strong><div class="bar"><div style="width:${pct}%;background:var(--empty)"></div></div><div class="bar"><div style="width:100%"></div></div></div>`;
}
function solutionScreen(){
  state.step=11;
  render(`<div class="eyebrow">🖥 THE SOLUTION</div>
  <h2>これは、<span style="color:var(--danger)">他人事ではありません。</span></h2>
  <p class="muted" style="font-size:16px">今、御社の現場でも同じことが起きています。<br>今回のMISSIONで埋まらなかった項目は、仕組みがあれば埋められます。</p>
  <div class="compare-head"><span></span><span>MISSION体験</span><span>導入後</span></div>
  <div class="status">
    ${statusRowCompare('📝 記録','recorded')}
    ${statusRowCompare('🔍 検索','searchable')}
    ${statusRowCompare('📊 改善結果','result')}
    ${statusRowCompare('🌐 共有','shared')}
  </div>
  <ul class="feature-list">
    <li>💡 現場の気づきを、その場で改善提案として登録</li>
    <li>🤖 AIが内容を整理し、関連する知識と結びつける</li>
    <li>✅ 検討〜採否とその理由まで記録が残る</li>
    <li>🔍 過去の提案や結果を、いつでもキーワードで検索できる</li>
    <li>🌐 採用されると自動でマニュアル・ナレッジへ反映され、他の人も使える</li>
  </ul>
  <button class="btn" onclick="callStaff()">📅 詳細診断・デモへ進む</button>
  <button class="btn secondary" onclick="restart()">🔁 もう一度体験する</button>`);
}
function callStaff(){
  state.step=12;
  render(`<div class="eyebrow">🚀 NEXT STEP</div>
  <h1>この続きは、<br>御社の現場で。</h1>
  <p class="muted" style="font-size:16px">今回は5分の体験でしたが、実際の診断では<br>御社の状況に合わせて「どこで改善が止まっているか」を確認します。</p>
  <div class="actions">
    <a class="action" href="${CONTACT_LINKS.booking}" target="_blank" rel="noopener"><span class="aicon">📅</span>詳細診断・デモを予約する</a>
    <a class="action" href="${CONTACT_LINKS.document}" target="_blank" rel="noopener"><span class="aicon">📄</span>導入事例・資料を見る</a>
    <a class="action" href="index.html"><span class="aicon">🏭</span>他の業種の体験も見る</a>
  </div>
  <button class="btn secondary" onclick="restart()">🔁 最初から見る</button>`);
}
function restart(){
  state.missionIndex=0;state.illustrationPhase="";
  state.step=0;state.action=null;state.searchFound=false;state.bossChoice=null;
  state.knowledge={idea:true,recorded:0,searchable:0,result:0,shared:0};missionSelect();
}
function tryResume(){
  const token = new URLSearchParams(location.search).get('resume');
  if(!token) return false;
  const data = decodeResumeToken(token);
  if(!data) return false;
  state.missionIndex = data.mi || 0;
  state.mission = MISSIONS[state.missionIndex] || MISSIONS[0];
  state.knowledge = Object.assign({idea:true, recorded:0, searchable:0, result:0, shared:0}, data.k || {});
  (data.h==='genComplete' ? genComplete : complete)();
  return true;
}
if(!tryResume()) missionSelect();
</script>
</body>
</html>
